<svg fill="none" viewBox="0 0 800 240" width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace;
          background: linear-gradient(135deg, #1a1b26 0%, #16161e 100%);
          border: 1px solid #292e42;
          border-radius: 12px;
          padding: 24px 32px;
          box-sizing: border-box;
          height: 240px;
          color: #c0caf5;
          position: relative;
          overflow: hidden;
        }
        .window-header { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #f7768e; }
        .dot-yellow { background: #e0af68; }
        .dot-green { background: #9ece6a; }
        .title { font-size: 28px; font-weight: 700; color: #7aa2f7; margin-bottom: 12px; }
        .type-container { font-size: 20px; font-weight: 500; color: #a9b1d6; display: flex; align-items: center; }
        .prompt-symbol { color: #bb9af7; margin-right: 12px; font-weight: 700; }
        .type-text::after {
          content: "Full-Stack Web Developer";
          animation: rolesCycle 12s infinite;
          color: #7dcfff;
          font-weight: 600;
        }
        @keyframes rolesCycle {
          0%, 28% { content: "Full-Stack Web Developer"; }
          33%, 61% { content: "AI & Multimodal Researcher"; }
          66%, 95% { content: "CSE Student @ DIU (2023 - 2026)"; }
          100% { content: "Full-Stack Web Developer"; }
        }
        .cursor {
          display: inline-block;
          width: 9px;
          height: 22px;
          background: #7aa2f7;
          margin-left: 6px;
          animation: blink 1s step-start infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .footer-tag { position: absolute; bottom: 16px; right: 28px; font-size: 13px; color: #565f89; }
      </style>
      <div class="container">
        <div class="window-header">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="title">Hi there, I'm Alauddin 👋</div>
        <div class="type-container">
          <span class="prompt-symbol">➜  ~</span>
          <span class="type-text"></span>
          <span class="cursor"></span>
        </div>
        <div class="footer-tag">system: ready // dev: active</div>
      </div>
    </div>
  </foreignObject>
</svg>
